[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "degradation-simulator"
version = "0.1.0"
description = "Physics-based Degradation Simulator for Sustainable Packaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit",
    "pyyaml"
]

[project.optional-dependencies]
mlx = ["mlx"]
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
