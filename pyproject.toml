[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "degradation-simulator"
version = "0.1.0"
description = "Physics-based Degradation Simulator for Sustainable Packaging"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit",
    "pyyaml",
    "onnxruntime",
    "opencv-python",
    "ultralytics",
    "pillow",
    "onnxruntime",
    "opencv-python",
    "ultralytics",
    "pillow"
]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["backend/src"]
